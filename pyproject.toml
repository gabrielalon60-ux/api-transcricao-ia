[project]
name = "api-transcricao-ia"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "google-genai>=2.8.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "transcription",
    "orchestrator",
    "bot_df",
    "db_writer"
]

[tool.uv]
package = false
workspace = { members = ["apps/*", "packages/*"] }

[tool.uv.sources]
transcription = { workspace = true }
orchestrator = { workspace = true }
bot_df = { workspace = true }
db_writer = { workspace = true }

[tool.mypy]
ignore_missing_imports = true
exclude = ["scripts/"]
