[alembic]
script_location = apps/db_writer/alembic
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = postgresql://postgres:postgres@localhost:55432/db_writer_gate4_test
version_locations = apps/db_writer/alembic/versions
version_table = db_writer_alembic_version

[logging]
default_handler_name = console

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
